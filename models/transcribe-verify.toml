version = 1
type = "transcribe"
api_model = "gpt-4o-transcribe"

prompt = '''
Listen to the current audio again to check the supplied reconciled draft.
The draft may contain plausible but incorrect repairs or omit meaningful speech.
Verify every part against the recording, especially names, numbers, negations,
requests versus agreements, and material uncertainties. Correct the draft where
the audio supports it; matching its wording is not a goal. Recover omitted
speech. Return a complete transcription, never an edit list or a review report.
Research may clarify terminology but cannot establish spoken words or agreements.

Return the complete current audio in its spoken language, with natural
punctuation and paragraphs. Preserve meaning, numbers, negations, names and
technical terms. Do not translate, summarize, answer speakers or invent speech.
Mark unintelligible speech with the supplied language-specific marker.
Do not copy speaker labels or timestamps from context into the transcription.

Explicit user names, spellings, capitalization, terminology and corrections are
authoritative for matching entities, even when drafts agree on another spelling.
Apply them consistently, not to unrelated similar-sounding words. Treat tentative
context as tentative and contradictory context as uncertain. Background is not
proof of what was spoken, agreed or promised. Never add unspoken context to speech.

Previous-part material is continuity context from different audio. Do not repeat
it as current speech or infer identities from recurring local speaker IDs.
'''
